<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Planned contribution workflow</title><desc id="desc">Maintainer policy and contributor resources feed task selection. Implementation is independently checked. Passing work becomes a Draft PR for project review. Failed checks can trigger bounded repair or a stopped report.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8D987F"/></marker></defs><rect width="1200" height="510" rx="18" fill="#151711"/><g font-family="DejaVu Sans,Arial,sans-serif"><rect x="40" y="24" width="250" height="68" rx="12" fill="#23281C" stroke="#414A34"/><text x="165.0" y="54" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Maintainer policy</text><text x="165.0" y="79" text-anchor="middle" fill="#B5BDA8" font-size="13">Rules and eligible tasks</text><rect x="330" y="24" width="250" height="68" rx="12" fill="#23281C" stroke="#414A34"/><text x="455.0" y="54" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Contributor resources</text><text x="455.0" y="79" text-anchor="middle" fill="#B5BDA8" font-size="13">Supported agent and budget</text><path d="M165 92V172" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><path d="M455 92V130H165V172" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="174" width="250" height="84" rx="12" fill="#23281C" stroke="#414A34"/><text x="165.0" y="204" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Select and claim</text><text x="165.0" y="229" text-anchor="middle" fill="#B5BDA8" font-size="13">One eligible task</text><rect x="330" y="174" width="250" height="84" rx="12" fill="#23281C" stroke="#414A34"/><text x="455.0" y="204" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Implement the task</text><text x="455.0" y="229" text-anchor="middle" fill="#B5BDA8" font-size="13">Isolated workspace</text><rect x="620" y="174" width="250" height="84" rx="12" fill="#23281C" stroke="#414A34"/><text x="745.0" y="204" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Required checks</text><text x="745.0" y="229" text-anchor="middle" fill="#B5BDA8" font-size="13">Independent verification</text><rect x="910" y="174" width="250" height="84" rx="12" fill="#F2A43A" stroke="#414A34"/><text x="1035.0" y="204" text-anchor="middle" fill="#20251A" font-size="17" font-weight="600">Draft pull request</text><text x="1035.0" y="229" text-anchor="middle" fill="#20251A" font-size="13">Immutable result and report</text><path d="M290 216H328" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 216H618" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><path d="M870 216H908" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><text x="877" y="199" fill="#B5BDA8" font-size="12">pass</text><rect x="480" y="325" width="250" height="72" rx="12" fill="#23281C" stroke="#414A34"/><text x="605.0" y="355" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Bounded repair</text><text x="605.0" y="380" text-anchor="middle" fill="#B5BDA8" font-size="13">Only while budget remains</text><path d="M745 258V296H605V323" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><text x="758" y="285" fill="#B5BDA8" font-size="12">fail</text><path d="M480 361H455V260" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><text x="391" y="313" fill="#B5BDA8" font-size="12">retry</text><rect x="480" y="438" width="250" height="52" rx="12" fill="#23281C" stroke="#414A34"/><text x="605.0" y="468" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Stop with a report</text><path d="M605 397V436" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/><text x="621" y="424" fill="#B5BDA8" font-size="12">limit reached</text><rect x="910" y="325" width="250" height="72" rx="12" fill="#23281C" stroke="#414A34"/><text x="1035.0" y="355" text-anchor="middle" fill="#F6F4ED" font-size="17" font-weight="600">Project CI and review</text><text x="1035.0" y="380" text-anchor="middle" fill="#B5BDA8" font-size="13">The maintainer decides</text><path d="M1035 258V323" fill="none" stroke="#8D987F" stroke-width="2" marker-end="url(#arrow)"/></g></svg>
