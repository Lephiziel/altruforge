name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Markdown and draft contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - name: Set up Python for contract tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned contract tooling
        run: python -m pip install --disable-pip-version-check -r .github/requirements-docs.txt
      - name: Check schemas and fixtures
        run: |
          check-jsonschema --check-metaschema spec/schemas/*.schema.json
          check-jsonschema --schemafile spec/schemas/project.schema.json examples/project.yaml .altruforge/project.yaml
          check-jsonschema --schemafile spec/schemas/run-report.schema.json examples/run-report.json
          check-jsonschema --schemafile spec/schemas/event.schema.json examples/event.json
          check-jsonschema --schemafile spec/schemas/task-lease.schema.json examples/task-lease.json
