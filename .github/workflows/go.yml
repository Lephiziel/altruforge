name: Go application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Download dependencies
        run: go mod download
      - name: Require committed dependency metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -f go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.sum)"
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race checks
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/altruforge
