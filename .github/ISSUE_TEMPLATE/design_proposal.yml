name: Design proposal
description: Propose a scoped change to the product, architecture, or draft specification.
title: "[Design] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters the problem and what concrete behavior is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and evidence
      description: How would a reviewer determine that the change works?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Affected contracts, platforms, dependencies, and explicit exclusions.
